<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kull</title>
<meta name="description" content="Kull, an Android app for keeping your Salah Streak.">
<style>
  :root {
    --bg: #0e1211;
    --surface: #161b1a;
    --text: #e6eae9;
    --muted: #9aa5a2;
    --accent: #2ebf6c;
    --border: #232b29;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --surface: #f5f7f6;
      --text: #14201c;
      --muted: #5c6a66;
      --accent: #12854a;
      --border: #e2e8e6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 48px 16px 96px;
  }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; color: var(--accent); margin: 0 0 10px; }
  .updated { color: var(--muted); font-size: .9rem; margin-bottom: 32px; }
  .intro { margin-bottom: 32px; }
  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  section p { margin: 0 0 12px; }
  section p:last-child { margin-bottom: 0; }
  a { color: var(--accent); }
  footer { color: var(--muted); font-size: .85rem; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>Kull</h1>
  <p class="updated">An Android app for keeping your Salah Streak.</p>
  <section>
    <p><a href="privacy-policy.html">Privacy policy</a></p>
    <p><a href="delete-account.html">Delete your account</a></p>
    <p><a href="mailto:support@theepochguy.in">support@theepochguy.in</a></p>
  </section>
  <footer>Kull · com.kull.app</footer>
</main>
</body>
</html>
