<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kull</title>
<meta name="description" content="Kull, an Android app for keeping your Salah Streak.">
<meta name="theme-color" content="#0F4C45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F2E9;
    --card: #FFFDF8;
    --border: #E5DCCA;
    --teal: #0F4C45;
    --teal-deep: #0E4741;
    --gold: #C0913F;
    --gold-text: #8A621E;
    --gold-bright: #E6C381;
    --text: #1E2A28;
    --text-2: #56625E;
    --text-3: #7F8985;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font: 16px/1.65 "Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 28px 16px 72px;
  }
  main { max-width: 680px; margin: 0 auto; }
  .brand {
    font-family: "EB Garamond", Georgia, serif;
    font-size: 1.5rem; font-weight: 600; color: var(--teal);
    text-decoration: none; display: inline-block; margin-bottom: 18px;
  }
  .hero {
    position: relative; overflow: hidden;
    background: var(--teal); color: #fff;
    border-radius: 22px; padding: 26px 24px 24px; margin-bottom: 18px;
  }
  .hero::after {
    content: ""; position: absolute; right: -28px; top: -28px;
    width: 120px; height: 120px; border: 1px solid rgba(230,195,129,.35);
    transform: rotate(18deg);
  }
  .hero::before {
    content: ""; position: absolute; right: -6px; top: -40px;
    width: 120px; height: 120px; border: 1px solid rgba(230,195,129,.22);
    transform: rotate(40deg);
  }
  .eyebrow {
    font-size: .72rem; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gold-bright); margin: 0 0 6px;
  }
  h1 {
    font-family: "EB Garamond", Georgia, serif; font-weight: 600;
    font-size: 2.1rem; line-height: 1.15; margin: 0 0 8px; color: #fff;
  }
  .hero p { margin: 0; color: rgba(255,255,255,.82); }
  .rule { width: 36px; height: 2px; background: var(--gold); margin: 14px 0; border: 0; }
  section {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 20px 22px; margin-bottom: 14px;
  }
  h2 {
    font-size: .74rem; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gold-text); margin: 0 0 10px;
  }
  section p { margin: 0 0 12px; color: var(--text-2); }
  section p:last-child { margin-bottom: 0; }
  a { color: var(--teal); font-weight: 600; text-decoration-color: var(--gold); text-underline-offset: 3px; }
  .links a {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-top: 1px solid var(--border); text-decoration: none;
  }
  .links a:first-child { border-top: 0; padding-top: 2px; }
  .links a::after { content: "›"; color: var(--text-3); font-size: 1.3rem; font-weight: 400; }
  footer { color: var(--text-3); font-size: .85rem; margin-top: 28px; text-align: center; }
</style>
</head>
<body>
<main>
  <a class="brand" href="index.html">Kull</a>
  <div class="hero">
    <p class="eyebrow">Assalamu alaikum</p>
    <h1>Kull</h1>
    <p>Your salah, in one place: prayer times, your streak, duas, qibla and nearby masjids.</p>
  </div>
  <section class="links">
    <a href="privacy-policy.html">Privacy policy</a>
    <a href="delete-account.html">Delete your account</a>
    <a href="mailto:support@theepochguy.in">Contact support</a>
  </section>

  <footer>Kull · com.kull.app</footer>
</main>
</body>
</html>
